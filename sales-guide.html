<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Guides and Tools — Training Hub EAC</title>
  <link rel="icon" type="image/png" href="assets/logo-ea.png">
  <link rel="stylesheet" href="assets/style.css?v=10">
  <link rel="stylesheet" href="assets/sales-guide.css?v=10">
</head>
<body>
  <div class="app">
    <aside class="sidebar no-print" id="sidebar"></aside>

    <div class="content">
      <div class="panel">
        <a class="back-link" href="index.html">← Back to Home</a>

        <header class="sg-hero">
          <span class="sg-eyebrow" id="sg-eyebrow"></span>
          <h1 id="sg-title"></h1>
          <p id="sg-desc"></p>
          <div class="sg-flow" id="sg-flow"></div>
        </header>

        <div class="sg-principle" id="sg-principle"></div>

        <!-- Channel switcher (functional) -->
        <section class="sg-channel">
          <h2>Select Sales Channel</h2>
          <div class="sg-channel-btns" id="sg-channels" role="tablist" aria-label="Sales channel"></div>
          <p class="sg-active">Active guidance: <strong id="sg-active-label"></strong></p>
        </section>

        <!-- Consultation flow -->
        <section class="sg-flow-sec">
          <h2>Consultation Flow</h2>
          <p class="sub">All 8 points automatically follow the channel you select.</p>
          <div id="sg-points"></div>
        </section>

        <!-- Sales tools -->
        <section class="sg-tools">
          <h2>Sales Tools</h2>
          <p class="sub">Use when a visual or worksheet will make the consultation easier.</p>
          <div class="grid" id="sg-tools"></div>
          <div class="sg-reminder" id="sg-reminder"></div>
        </section>

        <p class="sg-footer" id="sg-footer"></p>
      </div>
    </div>
  </div>

  <script src="data/resources.js?v=10"></script>
  <script src="assets/app.js?v=10"></script>
  <script src="assets/shell.js?v=10"></script>
  <script src="data/sales-guide-data.js?v=10"></script>
  <script src="assets/sales-guide.js?v=10"></script>
  <script>renderSalesGuide();</script>
</body>
</html>
